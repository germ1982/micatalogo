; Sitios de los clientes para deploy/publicar.php.
; Copiá este archivo como sitios.ini (que NO se sube al repositorio) y completalo.
; Un bloque [nombre] por sitio. Las contraseñas solo van en sitios.ini, en tu PC.

[ejemplo]
url = "https://ejemplo.rf.gd"

; FTP (en InfinityFree: Account Details del panel)
ftp_host = "ftpupload.net"
ftp_usuario = "if0_00000000"
ftp_clave = ""
; Carpeta del sitio en el FTP (en InfinityFree: /<dominio>/htdocs)
ftp_carpeta = "/ejemplo.rf.gd/htdocs"
; 1 = conexión cifrada (FTPS), si el hosting la acepta
ftp_tls = 0

; Base de datos (en InfinityFree: MySQL Databases). Se usa solo para armar el .env la primera vez.
db_host = "sql000.infinityfree.com"
db_nombre = "if0_00000000_ejemplo"
db_usuario = "if0_00000000"
db_clave = ""

; Para probar en tu PC sin FTP: ftp_host = "local:C:/xampp/htdocs" copia los archivos a
; C:/xampp/htdocs/<ftp_carpeta>
